name: test-google-news

# F3, Route A: temporary probe of Google News per-outlet RSS from GitHub Actions'
# network, for the four feeds blocked direct. Not part of the app; remove this file
# once its result is recorded in sources.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Google News RSS for the four blocked outlets
        run: |
          python3 - <<'PY'
import re
import urllib.error
import urllib.request

UA = "AlmanacFetcher/0.1 (personal news reader)"
PAIRS = [
    ("times_of_israel", "timesofisrael.com"),
    ("middle_east_eye", "middleeasteye.net"),
    ("import_ai", "importai.substack.com"),
    ("indian_express", "indianexpress.com"),
]

for sid, domain in PAIRS:
    url = f"https://news.google.com/rss/search?q=site:{domain}&hl=en-US&gl=US&ceid=US:en"
    print(f"=== {sid} ({domain}) ===")
    try:
        req = urllib.request.Request(url, headers={"User-Agent": UA})
        with urllib.request.urlopen(req, timeout=20) as resp:
            status = resp.status
            data = resp.read()
    except urllib.error.HTTPError as exc:
        print(f"status={exc.code} ERROR {exc}")
        continue
    except Exception as exc:
        print(f"status=ERROR {exc}")
        continue
    text = data.decode("utf-8", "replace")
    items = re.findall(r"<item>(.*?)</item>", text, re.S)
    print(f"status={status} bytes={len(data)} items={len(items)}")
    if not items:
        continue
    it = items[0]
    title = re.search(r"<title>(.*?)</title>", it, re.S)
    link = re.search(r"<link>(.*?)</link>", it, re.S)
    pub = re.search(r"<pubDate>(.*?)</pubDate>", it, re.S)
    src = re.search(r'<source url="([^"]*)"', it)
    desc = re.search(r"<description>(.*?)</description>", it, re.S)
    direct_href = None
    if desc:
        for href in re.findall(r'href="([^"]+)"', desc.group(1)):
            if "news.google.com" not in href:
                direct_href = href
                break
    print("first item title:", (title.group(1)[:160] if title else None))
    print("first item link (google form):", (link.group(1)[:160] if link else None))
    print("first item pubDate:", (pub.group(1) if pub else None))
    print("first item <source url>:", (src.group(1) if src else None))
    print("real article url present in description:", direct_href)
PY

name: deploy-relay

# F3: deploys the Almanac feed relay (relay/), a Cloudflare Worker that serves a
# hard-coded allowlist of the four feeds blocked from GitHub Actions' network. Manual
# only, same Cloudflare secrets publish.yml already uses, mapped the same way. Never
# prints a secret value.
on:
  workflow_dispatch:
  # Belt and suspenders for a brand new workflow_dispatch-only workflow: GitHub Actions
  # can take a short while to register a freshly pushed workflow for on-demand dispatch,
  # so a push that touches this file also runs it directly (same pattern cf-check.yml
  # already uses).
  push:
    paths: ['.github/workflows/deploy-relay.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets are present
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare secrets not set"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Deploy relay Worker
        if: steps.cf.outputs.ok == 'true'
        id: deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          npx --yes wrangler@4.137.0 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::could not find the deployed workers.dev URL in wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "relay deployed at: $url"

      - name: Fetch each allowlisted feed through the relay and record results
        if: steps.cf.outputs.ok == 'true'
        run: |
          python3 - "${{ steps.deploy.outputs.url }}" <<'PY'
import re
import sys
import urllib.error
import urllib.request

base = sys.argv[1]
for sid in ("times_of_israel", "middle_east_eye", "import_ai", "indian_express"):
    url = f"{base}/feed/{sid}"
    print(f"=== {sid} ({url}) ===")
    try:
        req = urllib.request.Request(url, headers={"User-Agent": "AlmanacFetcher/0.1 (personal news reader)"})
        with urllib.request.urlopen(req, timeout=20) as resp:
            status = resp.status
            data = resp.read()
    except Exception as exc:
        print(f"status=ERROR {exc}")
        continue
    items = re.findall(r"<item>", data.decode("utf-8", "replace"))
    print(f"status={status} bytes={len(data)} items={len(items)}")

# 404 proof: anything off the allowlist must not resolve.
url = f"{base}/feed/npr"
req = urllib.request.Request(url, headers={"User-Agent": "AlmanacFetcher/0.1 (personal news reader)"})
try:
    urllib.request.urlopen(req, timeout=20)
    print("allowlist check FAILED: /feed/npr did not 404")
except urllib.error.HTTPError as exc:
    print(f"allowlist check: /feed/npr -> {exc.code} (expected 404)")
PY

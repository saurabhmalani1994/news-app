name: publish

# Fetch every feed in sources.json, validate the pool, build the page, deploy to
# Cloudflare Pages by direct upload (R1, R30). The publish job runs standard library
# Python only; the pip install lives in the test job, which the schedule trigger
# skips, so the cron path never installs Python packages. Hourly at :17, approved by
# the owner 2026-09-24, from the measured run time (about 40s publish, 1 billed minute).
# A push that touches only docs/ does not deploy: nothing under docs/ reaches the page,
# and a docs push used to cancel the queued run of a code push (one pending per group).
# B1: a manual run can also upload the pre-cap candidate list for gold-set labeling
# (tests/fixtures/bundles/README.md). Only a workflow_dispatch with dump_candidates true
# does; the hourly schedule and pushes never make an artifact, so storage stays free.
# C1: the trigger input lets the cron/ Worker ask for an hourly run by name (R44,
# GitHub's own `schedule:` below is best effort and was observed firing only twice in
# about ten hourly slots). A dispatch with trigger=cron skips the test job exactly like
# `schedule` does, so a cron-shaped run never installs Python packages either.
on:
  workflow_dispatch:
    inputs:
      dump_candidates:
        description: "B1: also upload the pre-cap candidate list as a 7-day artifact"
        type: boolean
        default: false
      trigger:
        description: "C1: set to cron by the cron Worker; skips the test job like schedule does"
        type: string
        default: "manual"
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    # C1: skips on the GitHub-native schedule and on a cron-shaped dispatch (the Worker's
    # trigger=cron) alike, so neither path installs Python packages (R30).
    if: github.event_name != 'schedule' && inputs.trigger != 'cron'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install -q -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser-side JS tests (S10 profile, ranker, S19 AI gate)
        run: node --test tests/js/*.test.js

  publish:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # F6: state.json (S06 source health, S32 event holds) restored ahead of the
      # fetch, so the fetcher never needs the live pool.json read once Cloudflare
      # Access is on. The save key is unique per run/attempt and the restore uses
      # only the prefix, so the most recently saved state always wins; scheduled,
      # push and workflow_dispatch runs all run on main and so share one cache.
      - name: Restore run-to-run state (F6)
        uses: actions/cache/restore@v4
        with:
          path: .cache/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            state-

      # B7: the embedding vectors by article id (fetcher/embed.py), its own cache entry
      # so F6's state cache is untouched; the most recently saved one wins, as above.
      - name: Restore embedding vectors (B7)
        uses: actions/cache/restore@v4
        with:
          path: .cache/embeddings.json
          key: embed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            embed-

      - name: Fetch
        env:
          # S06: where the fetcher falls back to reading the previous run's
          # source_health block from when the state.json cache above is absent or
          # corrupt, to carry its consecutive-empty/error counters forward. Never
          # hard-coded in Python; this workflow env var is the only place it lives.
          PREVIOUS_POOL_URL: ${{ vars.PREVIOUS_POOL_URL || 'https://almanac-dt5.pages.dev/pool.json' }}
          # B1: empty (no dump) unless this is a dispatch that asked for one. Outside dist/,
          # which deploys; the fetcher refuses a dump path inside it.
          DUMP_CANDIDATES_PATH: ${{ (github.event_name == 'workflow_dispatch' && inputs.dump_candidates) && 'candidates/candidates.json' || '' }}
          # W2 (R50): the watch searches read every user's queries from the Workers KV
          # namespace almanac-interests with the pipeline token (Workers KV Storage).
          # fetcher/watch.py never prints it and logs only its env name; when it is
          # missing or refused the run searches nothing and publishes as before.
          # B7: the same token (Workers AI, Billing Read, Account Analytics Read) embeds
          # new items for the story term after its own plan check (fetcher/embed.py).
          CF_PIPELINE_TOKEN: ${{ secrets.CLOUDFLARE_PIPELINE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
        run: python3 -m fetcher.fanout --out dist/pool.json --sources sources.json

      # F6: saved right after Fetch, unconditionally, so this run's state reaches
      # the next run even if a later step (build, deploy) fails.
      - name: Save run-to-run state (F6)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save embedding vectors (B7)
        if: always() && hashFiles('.cache/embeddings.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/embeddings.json
          key: embed-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate pool (stdlib)
        run: python3 -m contract.validate dist/pool.json

      - name: Build page
        run: python3 -m app.build --pool dist/pool.json --out dist

      - name: Check Cloudflare secrets are present
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
        # Only main deploys: a workflow_dispatch on a slice branch (used to prove CI fixes)
        # builds and tests but must never replace the live site with unlanded code.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::not main ($GITHUB_REF), skipping deploy"
          elif [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set, skipping deploy"
          fi

      - name: Ensure Pages project exists
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          got=$(api "$base/almanac")
          if [ "$(echo "$got" | jq -r .success)" = "true" ]; then
            echo "project exists, subdomain $(echo "$got" | jq -r .result.subdomain)"
          else
            echo "lookup: $(echo "$got" | jq -c '[.errors[]? | {code, message}]')"
            made=$(api -X POST "$base" -d '{"name":"almanac","production_branch":"main"}')
            echo "project created: $(echo "$made" | jq -c '{success, subdomain: .result.subdomain, errors: [.errors[]? | {code, message}]}')"
            [ "$(echo "$made" | jq -r .success)" = "true" ]
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: '22'

      # W1 (R50): storage for the interests sync. The phone sends its phrase and
      # standing-story searches to functions/api/interests.js, a Pages Function that keeps
      # them in the Workers KV namespace "almanac-interests", bound to this Pages project
      # as INTERESTS (W2's fetcher reads the same namespace by title). Idempotent: the
      # namespace is found by title, and made only when absent, with
      # CLOUDFLARE_PIPELINE_TOKEN (Account, Workers KV Storage, Edit); the production
      # binding is written with CLOUDFLARE_API_TOKEN (Account, Cloudflare Pages, Edit)
      # only when it differs. Runs before the deploy, so the new deployment carries the
      # binding. Prints the namespace id and error codes only, never a token or a stored
      # value. Allowed to fail: without the binding the function answers 503, the site
      # still publishes, and the warning names the permission that is missing.
      - name: Ensure the interests KV namespace and its binding (W1)
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true
        env:
          KV_TOKEN: ${{ secrets.CLOUDFLARE_PIPELINE_TOKEN }}
          PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
        run: |
          set -uo pipefail
          errs='[.errors[]? | {code, message}]'
          if [ -z "$KV_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PIPELINE_TOKEN is not set, so the interests KV namespace cannot be made"
            exit 1
          fi
          kv() { curl -sS -H "Authorization: Bearer $KV_TOKEN" -H "Content-Type: application/json" "$@"; }
          pages() { curl -sS -H "Authorization: Bearer $PAGES_TOKEN" -H "Content-Type: application/json" "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          list=$(kv "$base/storage/kv/namespaces?per_page=100")
          if [ "$(echo "$list" | jq -r .success)" != "true" ]; then
            echo "KV list: $(echo "$list" | jq -c "$errs")"
            echo "::warning::CLOUDFLARE_PIPELINE_TOKEN cannot list KV namespaces; it needs Account, Workers KV Storage, Edit"
            exit 1
          fi
          id=$(echo "$list" | jq -r '[.result[] | select(.title == "almanac-interests") | .id][0] // empty')
          if [ -z "$id" ]; then
            made=$(kv -X POST "$base/storage/kv/namespaces" -d '{"title":"almanac-interests"}')
            echo "KV create: $(echo "$made" | jq -c "{success, errors: $errs}")"
            id=$(echo "$made" | jq -r '.result.id // empty')
          fi
          if [ -z "$id" ]; then
            echo "::warning::the almanac-interests KV namespace could not be found or made"
            exit 1
          fi
          echo "KV namespace almanac-interests: $id"
          got=$(pages "$base/pages/projects/almanac")
          if [ "$(echo "$got" | jq -r .success)" != "true" ]; then
            echo "Pages read: $(echo "$got" | jq -c "$errs")"
            exit 1
          fi
          bound=$(echo "$got" | jq -r '.result.deployment_configs.production.kv_namespaces.INTERESTS.namespace_id // empty')
          if [ "$bound" = "$id" ]; then
            echo "INTERESTS binding: already live on production"
            exit 0
          fi
          body=$(jq -nc --arg id "$id" '{deployment_configs: {production: {kv_namespaces: {INTERESTS: {namespace_id: $id}}}}}')
          res=$(pages -X PATCH "$base/pages/projects/almanac" -d "$body")
          echo "INTERESTS binding: $(echo "$res" | jq -c "{success, errors: $errs}")"
          if [ "$(echo "$res" | jq -r .success)" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN could not bind INTERESTS; it needs Account, Cloudflare Pages, Edit"
            exit 1
          fi

      # W1: run from the repo root, so wrangler also compiles and uploads functions/
      # (the /api/interests Pages Function) with the static site; its generated routes
      # send only /api/interests to the function, every other path stays static.
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.137.0 pages deploy dist --project-name almanac --branch main

      # B1: last, and allowed to fail, so a refused upload (the account's artifact storage
      # quota, measured full on 2026-09-24) can never stop the site from publishing. Runs
      # even when a step above failed, so the dump is not lost with the deploy.
      - name: Upload candidate dump (B1, dispatch with dump_candidates only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dump_candidates }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates/candidates.json
          retention-days: 7
          if-no-files-found: error

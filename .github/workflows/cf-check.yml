name: cf-check

# Read-only check that the Cloudflare secrets work. Prints pass/fail and error codes only.
# Re-run any time with: gh workflow run cf-check.yml
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cf-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
    steps:
      - name: Verify token, account and Pages access
        run: |
          [ -n "$CF_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNTID is empty"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          errs='[.errors[]? | {code, message}]'
          echo "user token verify:    $(api /user/tokens/verify | jq -c "{success, status: .result.status, errors: $errs}")"
          echo "account token verify: $(api "/accounts/$CF_ACCOUNT/tokens/verify" | jq -c "{success, status: .result.status, errors: $errs}")"
          echo "account read:         $(api "/accounts/$CF_ACCOUNT" | jq -c "{success, errors: $errs}")"
          pages=$(api "/accounts/$CF_ACCOUNT/pages/projects")
          echo "pages projects list:  $(echo "$pages" | jq -c "{success, names: [.result[]?.name], errors: $errs}")"
          [ "$(echo "$pages" | jq -r .success)" = "true" ]

name: f4-relay-probe

# F4: temporary, throwaway workflow. Compares the relay route against the existing
# Google News route for the four sources routed off GitHub Actions' blocked network
# (times_of_israel, middle_east_eye, import_ai, indian_express). Records status, item
# count, and whether items carry descriptions, images and full content on each route,
# so F4 can decide per source which route to keep. Removed once that decision lands.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare relay vs Google News per source
        run: |
          python3 <<'PY'
          import re
          import urllib.request

          UA = "AlmanacFetcher/0.1 (personal news reader)"
          RELAY_BASE = "https://almanac-relay.saurabhmalani1994.workers.dev"

          SOURCES = {
              "times_of_israel": "https://news.google.com/rss/search?q=site:timesofisrael.com&hl=en-US&gl=US&ceid=US:en",
              "middle_east_eye": "https://news.google.com/rss/search?q=site:middleeasteye.net&hl=en-US&gl=US&ceid=US:en",
              "import_ai": "https://news.google.com/rss/search?q=site:importai.substack.com&hl=en-US&gl=US&ceid=US:en",
              "indian_express": "https://news.google.com/rss/search?q=site:indianexpress.com&hl=en-US&gl=US&ceid=US:en",
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read()
              except Exception as exc:
                  return None, str(exc).encode()

          def describe(label, url):
              status, data = fetch(url)
              if status != 200:
                  print(f"  {label}: status={status} error={data[:200]!r}")
                  return
              text = data.decode("utf-8", "replace")
              items = re.findall(r"<item>.*?</item>", text, re.S)
              n = len(items)
              has_desc = sum(1 for it in items if re.search(r"<description>[^<].{20,}", it))
              has_image = sum(
                  1 for it in items
                  if re.search(r"<enclosure[^>]+(image|jpg|jpeg|png)", it, re.I)
                  or re.search(r"media:content", it)
                  or re.search(r"media:thumbnail", it)
              )
              has_full = sum(1 for it in items if re.search(r"content:encoded", it))
              print(f"  {label}: status={status} bytes={len(data)} items={n} "
                    f"with_description={has_desc} with_image={has_image} with_full_content={has_full}")

          for sid, google_url in SOURCES.items():
              print(f"=== {sid} ===")
              describe("relay     ", f"{RELAY_BASE}/feed/{sid}")
              describe("google_news", google_url)
          PY

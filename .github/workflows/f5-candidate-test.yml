name: f5-candidate-test

# F5 temporary: verifies proposed new sources.json candidates from GitHub Actions'
# own network (some sites block GitHub, per F2), using the real fanout fetch code.
# Removed once F5 lands.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run candidate test
        run: python3 -m fetcher._f5_candidate_test
